# CR 沒有 imagePullSecrets 欄位 → pull secret 掛在自訂 SA,CR 用 spec.serviceAccount 指過來
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otelcr.labels" . | nindent 4 }}
{{- with .Values.imagePullSecret }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
