# traces 的 LB 層(對照 base/span-lb.gen.yaml)
name: span-lb
image: ghcr.io/104corp/otel-collector/collector:0.110.0

resolverRBAC: true   # k8s resolver 需要 endpoints/endpointslices list/watch

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi     # GOMEMLIMIT = 819MiB

autoscaler:
  minReplicas: 4
  maxReplicas: 10
  targetCPUUtilization: 280   # 250m * 280% = 1000m * 70%
  targetMemoryUtilization: 80

ingresses:
  - name: http
    host: k8s-otel-span-lb-lab.104dc-dev.com   # 各環境 overlay values 覆寫
    port: 4318

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  exporters:
    loadbalancing:
      routing_key: traceID
      protocol:
        otlp:
          timeout: 3s
          tls:
            insecure: true
      resolver:
        k8s:
          # 舊名 alias(compat-services.yaml);棄用 alias 後改 span-collector-collector.open-telemetry
          service: span-collector.open-telemetry
          ports:
            - 4317
          timeout: 1s
    debug:
      verbosity: normal
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  service:
    telemetry:
      metrics:
        address: ${env:MY_POD_IP}:8888
    extensions:
      - health_check
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - loadbalancing
