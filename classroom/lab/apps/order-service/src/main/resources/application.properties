# PostgreSQL 連線（值由環境變數帶入，方便在 k8s 用 env 設定）
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/labdb}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:labpass}

# 開發用：自動建表
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# actuator health endpoint，給 k8s readiness/liveness probe 用
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
