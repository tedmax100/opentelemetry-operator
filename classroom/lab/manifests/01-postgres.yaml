apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: otel-lab
type: Opaque
stringData:
  POSTGRES_DB: labdb
  POSTGRES_USER: lab
  POSTGRES_PASSWORD: labpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: otel-lab
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          # lab 用，不掛 PVC，Pod 重啟資料就清空（簡化環境）
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lab", "-d", "labdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: otel-lab
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
